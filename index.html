<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LKW Dispo">
<link rel="manifest" href="manifest.json">
<title>LKW Dispo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
main{max-width:900px;margin:auto;padding:10px 0 30px}h1{margin:4px 0 2px;font-size:30px}.sub{color:#666;margin:0 0 14px}
.card{background:#fff;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;min-height:44px;padding:10px 15px;font:inherit;font-weight:700;background:#e5e5ea}button.primary{background:#111;color:#fff}button.danger{background:#ffe5e5;color:#a00}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}label{font-size:12px;color:#666;font-weight:700;display:block;margin-bottom:5px}
input,select{width:100%;height:46px;border:1px solid #d5d5da;border-radius:11px;background:#fafafa;padding:8px 10px;font:inherit;font-size:16px}
.truck,.tour{border:1px solid #ddd;border-radius:15px;padding:13px;margin:10px 0}.truck.green{border-left:6px solid #34c759}.truck.yellow{border-left:6px solid #ff9f0a}.truck.red{border-left:6px solid #ff3b30}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.stat{background:#f2f2f7;border-radius:11px;padding:9px}.small{font-size:11px;color:#666}.big{font-size:18px;font-weight:800;margin-top:3px}
.bar{height:9px;background:#e5e5ea;border-radius:20px;overflow:hidden;margin-top:10px}.bar>div{height:100%;background:#34c759}
.tourgrid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:9px}.recommend{margin-top:12px;background:#f2f2f7;border-radius:12px;padding:12px}.ok{color:#167a35;font-weight:800}.bad{color:#b42318;font-weight:800}.muted{color:#777;font-size:12px;line-height:1.45}.line{display:flex;justify-content:space-between;align-items:center;gap:8px}.del{min-height:36px;padding:7px 10px;font-size:13px}
@media(max-width:650px){.grid,.tourgrid,.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
<h1>LKW Dispo</h1>
<p class="sub">Automatische Tour-Zuordnung · Daten werden auf diesem Gerät gespeichert</p>

<section class="card">
<div class="actions">
<button class="primary" id="addTruck">+ LKW</button>
<button class="primary" id="addTour">+ Tour</button>
<button id="autoAll">Alle offenen Touren automatisch verplanen</button>
<button class="danger" id="clear">Alles löschen</button>
</div>
</section>

<section class="card">
<h2 style="margin:0 0 10px;font-size:19px">LKW</h2>
<div id="trucks"></div>
</section>

<section class="card">
<h2 style="margin:0 0 10px;font-size:19px">Touren</h2>
<div id="tours"></div>
</section>

<section class="card">
<h2 style="margin:0 0 10px;font-size:19px">Übersicht</h2>
<div class="grid">
<div><label>LKW</label><input id="s1" readonly></div>
<div><label>Touren</label><input id="s2" readonly></div>
<div><label>Offen</label><input id="s3" readonly></div>
<div><label>Restlenkzeit</label><input id="s4" readonly></div>
</div>
<p class="muted" style="margin-bottom:0">Planungslogik: maximal 9:00 h Lenkzeit und 15:00 h Arbeitsfenster pro LKW. Dies ist eine vereinfachte Dispo-Hilfe und kein Ersatz für Tachograph oder gesetzliche Prüfung.</p>
</section>
</main>

<script>
const KEY="lkw_dispo_app_v2";
let data={trucks:[],tours:[]};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d?.trucks&&d?.tours)data=d}catch(e){}
if(!data.trucks.length)data.trucks=[{id:uid(),name:"LKW 1",start:"06:00",manual:0}];

function uid(){return Date.now()+"_"+Math.random().toString(36).slice(2)}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function min(s){let a=(s||"00:00").split(":");return (+a[0]||0)*60+(+a[1]||0)}
function clock(x){x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function fmt(x){x=Math.max(0,Math.round(x));return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")+" h"}
function tmin(t){let x=min(t.to)-min(t.from);if(x<0)x+=1440;return x}
function drive(id,exclude){return data.tours.filter(t=>t.truckId===id&&t.id!==exclude).reduce((s,t)=>s+tmin(t),0)}
function total(t,exclude){return Math.min(540,Math.max(0,(+t.manual||0)+drive(t.id,exclude)))}
function intervals(t){
 let a=min(t.from),b=min(t.to);if(a===b)return [];
 if(b>a)return [[a,b]];
 return [[a,1440],[0,b]];
}
function overlap(a,b){
 return intervals(a).some(x=>intervals(b).some(y=>Math.max(x[0],y[0])<Math.min(x[1],y[1])));
}
function withinWindow(tour,truck){
 let start=min(truck.start), rel=(min(tour.from)-start+1440)%1440, d=tmin(tour);
 return d>0 && rel<=900 && rel+d<=900;
}
function candidates(tour){
 return data.trucks.map(tr=>{
   let need=tmin(tour), before=Math.max(0,540-total(tr,tour.id));
   let conflict=data.tours.some(x=>x.id!==tour.id&&x.truckId===tr.id&&overlap(tour,x));
   let window=!withinWindow(tour,tr);
   return {tr,need,before,after:before-need,conflict,window,ok:need>0&&need<=before&&!conflict&&!window};
 }).filter(x=>x.ok).sort((a,b)=>a.after-b.after);
}
function reason(c){
 let a=[];
 if(c.need<=0)a.push("Abfahrt und Ankunft prüfen");
 if(c.need>c.before)a.push("zu wenig Restlenkzeit");
 if(c.conflict)a.push("zeitliche Überschneidung");
 if(c.window)a.push("außerhalb des 15-h-Arbeitsfensters");
 return a.join(" · ");
}

function render(){
 renderTrucks();renderTours();summary();save();
}
function renderTrucks(){
 const box=document.getElementById("trucks");box.innerHTML="";
 data.trucks.forEach((tr,i)=>{
  const d=total(tr),r=Math.max(0,540-d),cls=r===0?"red":r<=120?"yellow":"green";
  const tours=data.tours.filter(t=>t.truckId===tr.id);
  const el=document.createElement("div");el.className="truck "+cls;
  el.innerHTML=`<div class="line"><strong style="font-size:19px">${esc(tr.name)}</strong><button class="del" type="button">LKW löschen</button></div>
  <div class="grid" style="margin-top:10px">
  <div><label>Name</label><input class="name" value="${esc(tr.name)}"></div>
  <div><label>Arbeitsbeginn</label><input class="start" type="time" value="${esc(tr.start)}"></div>
  <div><label>Zusätzliche Lenkzeit Std.</label><input class="mh" type="number" min="0" max="9" value="${Math.floor((+tr.manual||0)/60)}"></div>
  <div><label>Zusätzliche Lenkzeit Min.</label><input class="mm" type="number" min="0" max="59" value="${(+tr.manual||0)%60}"></div>
  </div>
  <div class="stats">
  <div class="stat"><div class="small">Lenkzeit</div><div class="big">${fmt(d)}</div></div>
  <div class="stat"><div class="small">Rest</div><div class="big">${fmt(r)}</div></div>
  <div class="stat"><div class="small">Arbeitsende</div><div class="big">${clock(min(tr.start)+900)}</div></div>
  <div class="stat"><div class="small">Touren</div><div class="big">${tours.length}</div></div>
  </div><div class="bar"><div style="width:${r/540*100}%"></div></div>
  <div style="margin-top:7px;font-size:13px;font-weight:800">${r===0?"ROT – Lenkzeit ausgeschöpft":r<=120?"GELB – "+fmt(r)+" Rest":"GRÜN – "+fmt(r)+" Rest"}</div>`;
  box.appendChild(el);
  el.querySelector(".name").onchange=e=>{tr.name=e.target.value||"LKW "+(i+1);render()};
  el.querySelector(".start").onchange=e=>{tr.start=e.target.value||"06:00";render()};
  const ch=()=>{let h=Math.max(0,Math.min(9,+el.querySelector(".mh").value||0)),m=Math.max(0,Math.min(59,+el.querySelector(".mm").value||0));tr.manual=h*60+m;render()};
  el.querySelector(".mh").onchange=ch;el.querySelector(".mm").onchange=ch;
  el.querySelector(".del").onclick=()=>{if(data.trucks.length===1)return alert("Mindestens ein LKW muss vorhanden sein.");if(confirm(tr.name+" löschen?")){data.trucks=data.trucks.filter(x=>x.id!==tr.id);data.tours.forEach(x=>{if(x.truckId===tr.id)x.truckId=""});render()}};
 });
}
function renderTours(){
 const box=document.getElementById("tours");box.innerHTML="";
 if(!data.tours.length){box.innerHTML='<p class="muted">Noch keine Tour vorhanden. Tippe auf „+ Tour“.</p>';return}
 data.tours.forEach((tour,i)=>{
  const cs=candidates(tour),assigned=data.trucks.find(x=>x.id===tour.truckId),best=cs[0];
  const opts='<option value="">— offen —</option>'+data.trucks.map(x=>`<option value="${esc(x.id)}" ${x.id===tour.truckId?"selected":""}>${esc(x.name)}</option>`).join("");
  const el=document.createElement("div");el.className="tour";
  el.innerHTML=`<div class="line"><strong>Tour ${i+1}</strong><button class="del" type="button">löschen</button></div>
  <div class="tourgrid" style="margin-top:10px">
  <div><label>Tourname</label><input class="tn" value="${esc(tour.name)}"></div>
  <div><label>Abfahrt</label><input class="from" type="time" value="${esc(tour.from)}"></div>
  <div><label>Ankunft</label><input class="to" type="time" value="${esc(tour.to)}"></div>
  <div><label>LKW</label><select class="sel">${opts}</select></div>
  </div>
  <div class="recommend">
  <div><strong>Lenkzeit: ${fmt(tmin(tour))}</strong></div>
  ${best?`<div class="ok" style="margin-top:5px">Bester LKW: ${esc(best.tr.name)} · danach ${fmt(best.after)} Rest</div>
  <button class="primary auto" style="margin-top:9px" type="button">Bester LKW automatisch zuweisen</button>`:
  `<div class="bad" style="margin-top:5px">Kein LKW passt aktuell.</div>
   <div class="muted" style="margin-top:4px">Geprüft werden Restlenkzeit, Überschneidungen und das 15-h-Arbeitsfenster.</div>`}
  ${assigned?`<div class="muted" style="margin-top:7px">Aktuell zugeordnet: ${esc(assigned.name)}${!cs.some(x=>x.tr.id===assigned.id)?' – aktuell nicht mehr passend':''}</div>`:''}
  </div>`;
  box.appendChild(el);
  const update=()=>{tour.name=el.querySelector(".tn").value||"Tour "+(i+1);tour.from=el.querySelector(".from").value||"00:00";tour.to=el.querySelector(".to").value||"00:00";tour.truckId=el.querySelector(".sel").value;render()};
  ["tn","from","to"].forEach(c=>el.querySelector("."+c).onchange=update);
  el.querySelector(".sel").onchange=update;
  if(best)el.querySelector(".auto").onclick=()=>{tour.truckId=best.tr.id;render()};
  el.querySelector(".del").onclick=()=>{if(confirm("Tour löschen?")){data.tours=data.tours.filter(x=>x.id!==tour.id);render()}};
 });
}
function summary(){
 let rest=data.trucks.reduce((s,t)=>s+Math.max(0,540-total(t)),0);
 document.getElementById("s1").value=data.trucks.length;
 document.getElementById("s2").value=data.tours.length;
 document.getElementById("s3").value=data.tours.filter(t=>!t.truckId).length;
 document.getElementById("s4").value=fmt(rest);
}
document.getElementById("addTruck").onclick=()=>{data.trucks.push({id:uid(),name:"LKW "+(data.trucks.length+1),start:"06:00",manual:0});render()};
document.getElementById("addTour").onclick=()=>{data.tours.push({id:uid(),name:"Tour "+(data.tours.length+1),from:"06:00",to:"07:00",truckId:""});render()};
document.getElementById("autoAll").onclick=()=>{
 let assigned=0;
 data.tours.forEach(t=>{if(!t.truckId){let c=candidates(t)[0];if(c){t.truckId=c.tr.id;assigned++}}});
 render();alert(assigned+" offene Tour(en) automatisch verplant.");
};
document.getElementById("clear").onclick=()=>{if(confirm("Wirklich alle LKW und Touren löschen?")){data={trucks:[{id:uid(),name:"LKW 1",start:"06:00",manual:0}],tours:[]};render()}};
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script>
</body>
</html>
